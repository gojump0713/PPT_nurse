name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 항상 최신 커밋 하나만 진행 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 검수 + 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 번들러가 없으므로 의존성 설치 단계가 없다.
      # tools/build.mjs 가 검수(check.mjs)를 먼저 돌리고, 실패하면 여기서 중단된다.
      - name: 검수 및 dist/ 생성
        run: node tools/build.mjs

      - name: 산출물 확인
        run: |
          echo "::group::dist 트리"
          find dist -type f | sort
          echo "::endgroup::"
          echo "총 용량: $(du -sh dist | cut -f1)"
          test -f dist/index.html || { echo "index.html 누락"; exit 1; }
          test -f dist/src/js/main.js || { echo "main.js 누락"; exit 1; }
          # 개수를 고정하지 않고, 레지스트리가 import 하는 화면 모듈이 전부 있는지 대조한다
          missing=0
          for f in $(grep -oE "\./s[0-9]+\.js" dist/src/js/screens/index.js | sort -u); do
            test -f "dist/src/js/screens/${f#./}" || { echo "화면 모듈 누락: $f"; missing=1; }
          done
          test "$missing" -eq 0 || exit 1
          echo "화면 모듈 $(grep -cE "^import \* as s[0-9]+" dist/src/js/screens/index.js)개 확인"

      - uses: actions/configure-pages@v5
        with:
          # 저장소 설정에서 Pages 를 켜 두지 않았어도 워크플로가 직접 활성화한다
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
